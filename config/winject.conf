# winject-l3 on the rover's P4. The radio is the C6 behind winject_proxy on
# this same chip, reached over loopback. Keys: winject-l3 docs/mplane.md.
# Pairs with rover-ground's winject-manager/config.cfg on the GS: same domain,
# channel and upstream ids, buses swapped, server (bind) instead of client.

winject.device        = 127.0.0.1
winject.console       = 22
winject.dplane_port   = 9000
winject.channel       = 13
# The C6 is heard at the GS only from about 5 dBm up (at 2 dBm, the GS bench
# setting for the RTL8812AU, nothing arrives), and the C6 tops out near 15.
# On the bench, OFDM_24M loses ~7% of frames against ~11% at OFDM_36M (18M
# is no better), with 15 dBm. Each end picks its own TX rate.
winject.modulation    = OFDM_24M
winject.power         = 15
winject.domain        = 0xB00B
winject.max_rate_kbps = 20000
winject.stats_sec     = 10
winject.radio_fcs     = signal

# Manager console for the operator, reachable over Ethernet.
manager.console_in    = 0.0.0.0:2400

upstream.size = 3

# Upstream 0: WireGuard on the GS side; nothing feeds it on the P4 yet.
upstream-0.mode             = UDP_SERVER_FORWARDING
upstream-0.fec.type         = RS_BLOCK_ERASURE
upstream-0.fec.k            = 1
upstream-0.fec.n            = 3
upstream-0.tx_bus           = b2
upstream-0.rx_bus           = a1
upstream-0.scheduler_budget = 4096
upstream-0.bind_address     = 127.0.0.1:22180

# Upstream 1: video. The P4's own vstreamer live TX sends here on loopback;
# the GS delivers it to sdl_stream_receiver on 127.0.0.1:21082. No FEC here:
# vstreamer's stream carries RS FEC end to end (tuned on the vstreamer
# m-plane, UDP 5090), so a second layer would only cost airtime.
upstream-1.mode             = UDP_SERVER_FORWARDING
upstream-1.fec.type         = NONE
upstream-1.tx_bus           = c3
upstream-1.rx_bus           = d4
upstream-1.scheduler_budget = 4096
upstream-1.bind_address     = 127.0.0.1:22081

# Upstream 2: radio link-test probe (rover -> GS), FEC off for clean loss
# metrics. Send probes to 127.0.0.1:22100. Buses swapped against the GS
# (tx f6 = GS rx f6); rover-ground's table and rover example list e5/f6 on
# both ends, which leaves the GS receiving nothing on upstream 2.
upstream-2.mode             = UDP_SERVER_FORWARDING
upstream-2.fec.type         = NONE
upstream-2.tx_bus           = f6
upstream-2.rx_bus           = e5
upstream-2.scheduler_budget = 4096
upstream-2.bind_address     = 127.0.0.1:22100
