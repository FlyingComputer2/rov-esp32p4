# winject-l3 on the rover's P4. The radio is the C6 behind winject_proxy on
# this same chip: m-plane over UDP loopback, d-plane over the in-process
# queues main.cpp registers (wifi_tx / wifi_rx on reactor rover_dp). Keys:
# winject-l3 docs/mplane.md. Pairs with the ground P4's built-in L3 config
# (gnd-esp32p4, l3_main() in main/main.cpp): same domain, channel and
# upstream ids, buses swapped.

radio.mplane          = 127.0.0.1:22
radio.dplane_tx       = wifi_tx
radio.dplane_rx       = wifi_rx
radio.reactor         = rover_dp
# Channel 1: on the bench the C6 -> GS direction loses ~7% of frames on
# channels 5-13 and GS -> C6 ~5% on 3-4; channel 1 is ~1% both ways.
radio.channel         = 1
# The C6 is heard at the GS only from about 5 dBm up (at 2 dBm, the GS bench
# setting for the RTL8812AU, nothing arrives), and the C6 tops out near 15.
# On the bench, OFDM_24M loses ~7% of frames against ~11% at OFDM_36M (18M
# is no better), with 15 dBm. Each end picks its own TX rate.
radio.modulation      = OFDM_24M
radio.power           = 15
winject.domain        = 0xB00B
winject.stats_sec     = 10
radio.fcs             = signal

# Manager console for the operator, reachable over Ethernet.
winject.console_in    = 0.0.0.0:2400

upstream.size = 10

# Buses follow the flow, not the index: sync b2/a1, video c3/d4, bwtest
# f6/e5, rover_sample 17/28, L3 m-plane 6a/a6, C6 m-plane 7c/c7,
# vstreamer m-plane 8d/d8, bwtest m-plane 4b/b4, sync m-plane 5c/c5, udp_ota
# 9e/e9. The ground P4 has the same upstream ids with the
# buses swapped.

# Upstream 0: clock sync (krono SynchClient, console UDP 5110). No rx, tx or
# reactor: L3 owns the queues and main.cpp hands them to SynchClient. The
# ground P4 runs SynchServer, the reference clock (tx a1 / rx b2). 5-13 byte
# datagrams, one exchange a second; the TX scheduler is round-robin, so the
# small budget costs it nothing. No FEC: a lost exchange is just a timeout.
upstream-0.mode             = QUEUE_FORWARDING
upstream-0.fec.type         = NONE
upstream-0.tx_bus           = b2
upstream-0.rx_bus           = a1
upstream-0.scheduler_budget = 256

# Upstream 1: video. The P4's own vstreamer live TX pushes into video_tx
# and reads the GS's reports from video_rx (both registered by main.cpp);
# the ground P4 hands it to its own video receiver (L3-owned queue, upstream 1,
# tx d4 / rx c3). No FEC here: vstreamer's stream carries RS FEC end to end
# (tuned on the vstreamer m-plane, UDP 5090), so a second layer would only
# cost airtime.
upstream-1.mode             = QUEUE_FORWARDING
upstream-1.fec.type         = NONE
upstream-1.tx_bus           = c3
upstream-1.rx_bus           = d4
upstream-1.scheduler_budget = 4096
upstream-1.rx               = video_tx
upstream-1.tx               = video_rx
upstream-1.reactor          = rover_dp

# Upstream 2: bandwidth tester (app_bwtest, console UDP 5100). No rx, tx or
# reactor: L3 owns the queues and main.cpp hands them to the tester. FEC off
# for clean loss counts. The ground P4 runs the same tester with the buses
# swapped (tx e5 / rx f6).
upstream-2.mode             = QUEUE_FORWARDING
upstream-2.fec.type         = NONE
upstream-2.tx_bus           = f6
upstream-2.rx_bus           = e5
upstream-2.scheduler_budget = 4096

# Upstream 3: rover_sample (RC car, console UDP 5120). No rx, tx or reactor:
# L3 owns the queues and main.cpp hands them to rover_sample. MSP v2, one frame
# per datagram: RC in at 50 Hz (24 B), telemetry out at 20 Hz (48 B). No FEC:
# every RC frame carries the full state, so a lost one is replaced 20 ms later;
# block FEC would only add latency. The ground P4 bridges it to USB channel 2
# and UDP 5120 with the buses swapped (tx 28 / rx 17).
upstream-3.mode             = QUEUE_FORWARDING
upstream-3.fec.type         = NONE
upstream-3.tx_bus           = 17
upstream-3.rx_bus           = 28
upstream-3.scheduler_budget = 256

# Upstream 4: L3 manager m-plane (console UDP 2400 on this P4). A UDP static
# upstream is the bridge: air datagrams from the ground go to the local console
# (tx), and the console's replies come back into this socket (rx) and go out on
# the air. The ground side is UDP server mode on 0.0.0.0:2410, which replies to
# the last operator, so use one operator at a time. Static mode forwards only
# datagrams from tx (the console), so nothing else on the P4 can inject into
# this bus. Each reply is one datagram: replies over ~1445 bytes (gm with no
# keys, lur/lut across all upstreams) are dropped; ask for single upstreams or
# keys. Buses 6a / a6 (the ground pairs them the other way round).
upstream-4.mode              = UDP_STATIC_FORWARDING
upstream-4.fec.type          = NONE
upstream-4.tx_bus            = 6a
upstream-4.rx_bus            = a6
upstream-4.scheduler_budget  = 256
upstream-4.rx_queue_capacity = 16
upstream-4.rx               = 127.0.0.1:2410
upstream-4.tx               = 127.0.0.1:2400

# Upstream 5: C6 radio m-plane (proxy UDP 22 on this P4). The local L3 also
# uses UDP 22; the proxy rewrites request tags and routes each reply to the
# matching client, so both can share it. This static upstream binds loopback
# port 2420 and forwards air requests to the proxy. The ground side is UDP
# server mode on 0.0.0.0:2420. There is no authentication: channel, power,
# modulation, reset and other radio commands are exposed over the air.
# Buses 7c / c7 (the ground pairs them the other way round).
upstream-5.mode              = UDP_STATIC_FORWARDING
upstream-5.fec.type          = NONE
upstream-5.tx_bus            = 7c
upstream-5.rx_bus            = c7
upstream-5.scheduler_budget  = 256
upstream-5.rx_queue_capacity = 16
upstream-5.rx                = 127.0.0.1:2420
upstream-5.tx                = 127.0.0.1:22

# Upstream 6: rover vstreamer m-plane (UDP 5090 on this P4). This static
# upstream binds loopback port 5092 and forwards air requests to vstreamer.
# The ground P4 already serves its own receiver m-plane on 5090, so its UDP
# server for the rover is 0.0.0.0:5092. There is no authentication: callers
# can change the rover video source, payloader and sender settings at run time.
# Buses 8d / d8 (the ground pairs them the other way round).
upstream-6.mode              = UDP_STATIC_FORWARDING
upstream-6.fec.type          = NONE
upstream-6.tx_bus            = 8d
upstream-6.rx_bus            = d8
upstream-6.scheduler_budget  = 256
upstream-6.rx_queue_capacity = 16
upstream-6.rx                = 127.0.0.1:5092
upstream-6.tx                = 127.0.0.1:5090

# Upstreams 7 and 8: the bandwidth tester's (UDP 5100) and the clock-sync
# client's (UDP 5110) consoles for ground operators. No rx, tx or reactor: L3
# owns the queues and main.cpp hands each to an mplane_relay. Unlike the static
# upstreams 4-6, several operators can use them at once: the ground serves
# UDP 5102 / 5112, puts a 1-byte client id in front of each request, and the
# relay sends it to the console from that client's own loopback socket (up to
# 4 clients, least recently used closed first), so each reply goes back to
# the operator who asked. Replies over 1444 bytes are dropped. There is no
# authentication: callers can start bandwidth tests and switch the sync mode.
# Buses 4b / b4 and 5c / c5 (the ground pairs them the other way round).
upstream-7.mode              = QUEUE_FORWARDING
upstream-7.fec.type          = NONE
upstream-7.tx_bus            = 4b
upstream-7.rx_bus            = b4
upstream-7.scheduler_budget  = 256
upstream-7.rx_queue_capacity = 16

upstream-8.mode              = QUEUE_FORWARDING
upstream-8.fec.type          = NONE
upstream-8.tx_bus            = 5c
upstream-8.rx_bus            = c5
upstream-8.scheduler_budget  = 256
upstream-8.rx_queue_capacity = 16

# Upstream 9: udp_ota, the app update and config-file server (UDP 3232 on
# this P4, tools/udp_ota.py). No rx, tx or reactor: L3 owns the queues and
# main.cpp hands them to an mplane_relay, like upstreams 7 and 8, so several
# clients can talk to it at once (one OTA and one open file at a time; status
# from anyone). The ground serves it on 0.0.0.0:2430. One message per
# datagram (fragments of 1024 B + 3 B header); the tool keeps up to 8 in
# flight and retransmits, so no FEC. While an image comes in, video pauses.
# There is no authentication: anyone reaching the ground's UDP 2430 can
# replace and reboot this image and rewrite its config. Buses 9e / e9 (the
# ground pairs them the other way round).
upstream-9.mode              = QUEUE_FORWARDING
upstream-9.fec.type          = NONE
upstream-9.tx_bus            = 9e
upstream-9.rx_bus            = e9
upstream-9.scheduler_budget  = 4096
upstream-9.rx_queue_capacity = 64
